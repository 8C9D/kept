services:
  db:
    image: postgres:16
    container_name: kept-db
    environment:
      POSTGRES_USER: kept
      POSTGRES_PASSWORD: kept
      POSTGRES_DB: kept
    ports:
      - "5432:5432"
    volumes:
      - kept-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kept -d kept"]
      interval: 5s

  # Local object storage behind the same S3-compatible adapter that will
  # talk to R2 in deployment (spec §4.2, wave-3 gate review). Credentials
  # are local-container-only, same reasoning as kept/kept above.
  #
  # MinIO was archived upstream: `minio/minio` left Docker Hub and dl.min.io
  # stopped serving binaries, which failed every CI run from about 2026-10-02.
  # This is the last community build, frozen, and pinned by digest because
  # nothing will ever update it. Test-only: it holds synthetic local data and
  # never reaches production, so an unmaintained image is acceptable here.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    container_name: kept-minio
    environment:
      MINIO_ROOT_USER: kept
      MINIO_ROOT_PASSWORD: kept-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kept-minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kept-pgdata:
  kept-minio-data:
