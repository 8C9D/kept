services:
  db:
    image: postgres:16
    container_name: kept-db
    environment:
      POSTGRES_USER: kept
      POSTGRES_PASSWORD: kept
      POSTGRES_DB: kept
    ports:
      - "5432:5432"
    volumes:
      - kept-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kept -d kept"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kept-pgdata:
