# Fly.io configuration for the Kept API origin (spec §4.2, ratified
# Aug 7 2026: Node on Fly behind a Cloudflare proxy).
#
# Secrets are NOT set here - fly.toml is committed. They are set once with
# `fly secrets set` (see docs/Runbook.md): DATABASE_URL, SESSION_JWT_SECRET,
# APPLE_CLIENT_ID, ANTHROPIC_API_KEY, STORAGE_ENDPOINT, STORAGE_BUCKET,
# STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY, and later
# EDGE_SHARED_SECRET.

app = "keptapp-api"
primary_region = "yyz"

[http_service]
  internal_port = 3000
  force_https = true
  # Never scaled to zero: a cold start on pull-to-refresh would read as the
  # honest-failure timeout (10 s) the wave-5 offline work put in front of
  # people, and at one always-on shared-cpu machine the cost is dollars.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Liveness only, deliberately (docs/DECISIONS.md, 2026-08-15): GET /health
  # answers a constant 200 from the process itself and touches neither Neon
  # nor R2. A database-pinging check at this cadence would keep Neon's
  # autosuspending compute awake permanently, and a restart - the only
  # remedy a failed check can buy - cannot fix a dead backing service; the
  # boot probes already refuse to bind the port until both services answer.
  # The grace period covers those probes' worst case (five 5 s database
  # attempts a second apart, then a 10 s storage cap) with room to spare.
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  # 2 GB, measured rather than guessed: a 250 MiB export peaks at 891 MiB
  # RSS (2.8x the payload), exports are serialized one-per-user, and 2 GB
  # is Fly's ceiling per shared CPU (spec §4.2, ratified Aug 7 2026).
  memory = "2gb"
